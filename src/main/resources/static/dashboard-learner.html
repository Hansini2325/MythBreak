<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Learner Dashboard – MythBreak</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">MythBreak</a>
        <div class="navbar-links">
            <a href="/courses.html">Browse Courses</a>
            <a href="/opportunities.html">Opportunities</a>
        </div>
        <div id="nav-user" style="display:flex;gap:0.625rem;align-items:center;"></div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="#overview" class="sidebar-link active" data-tab="overview"><span class="sidebar-icon">🏠</span>Overview</a>
                <a href="#enrollments" class="sidebar-link" data-tab="enrollments"><span class="sidebar-icon">📚</span>My Courses</a>
                <a href="#notifications" class="sidebar-link" data-tab="notifications"><span class="sidebar-icon">🔔</span>Notifications</a>
                <a href="#profile" class="sidebar-link" data-tab="profile"><span class="sidebar-icon">👤</span>Profile</a>
            </nav>
        </aside>

        <main class="main-content">

            <div id="tab-overview">
                <div class="section-header">
                    <div>
                        <h1 class="section-title" id="welcome-msg">Welcome back!</h1>
                        <p class="section-subtitle">Track your learning progress</p>
                    </div>
                </div>
                <div class="grid-4" style="margin-bottom:2rem;">
                    <div class="stat-card">
                        <div class="stat-icon blue">📚</div>
                        <div><div class="stat-value" id="stat-enrolled">—</div><div class="stat-label">Enrolled</div></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">✅</div>
                        <div><div class="stat-value" id="stat-completed">—</div><div class="stat-label">Completed</div></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">📊</div>
                        <div><div class="stat-value" id="stat-progress">—</div><div class="stat-label">Avg. Progress</div></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon purple">🔔</div>
                        <div><div class="stat-value" id="stat-notifs">—</div><div class="stat-label">Notifications</div></div>
                    </div>
                </div>

                <div class="section-header"><h2 class="section-title" style="font-size:1.05rem;">Active Courses</h2></div>
                <div id="active-courses-list"><div class="spinner"></div></div>
            </div>

            <div id="tab-enrollments" style="display:none;">
                <div class="section-header">
                    <div>
                        <h2 class="section-title">My Courses</h2>
                        <p class="section-subtitle">All enrolled courses and progress</p>
                    </div>
                    <a href="/courses.html" class="btn btn-primary btn-sm">Browse more</a>
                </div>
                <div id="enrollments-list"><div class="spinner"></div></div>
            </div>

            <div id="tab-notifications" style="display:none;">
                <div class="section-header">
                    <h2 class="section-title">Notifications</h2>
                </div>
                <div id="notifs-list"><div class="spinner"></div></div>
            </div>

            <div id="tab-profile" style="display:none;">
                <div class="section-header">
                    <h2 class="section-title">My Profile</h2>
                </div>
                <div class="card" style="max-width:540px;">
                    <div id="profile-msg"></div>
                    <form id="profile-form">
                        <div class="form-group">
                            <label class="form-label">Bio</label>
                            <textarea id="bio" class="form-control" placeholder="Tell us about yourself..."></textarea>
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
                            <div class="form-group">
                                <label class="form-label">Phone</label>
                                <input id="phoneNumber" type="text" class="form-control"/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">City</label>
                                <input id="city" type="text" class="form-control"/>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Country</label>
                            <input id="country" type="text" class="form-control"/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">LinkedIn URL</label>
                            <input id="linkedinUrl" type="url" class="form-control"/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">GitHub URL</label>
                            <input id="githubUrl" type="url" class="form-control"/>
                        </div>
                        <button type="submit" class="btn btn-primary">Save profile</button>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        Auth.requireRole('LEARNER');
        Auth.renderNavUser('nav-user');

        const user = Auth.getUser();
        document.getElementById('welcome-msg').textContent = `Welcome, ${user.firstName}!`;

        document.querySelectorAll('.sidebar-link').forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                const tab = link.dataset.tab;
                document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display = 'none');
                document.getElementById('tab-' + tab).style.display = '';
                if (tab === 'enrollments') loadEnrollments();
                if (tab === 'notifications') loadNotifications();
                if (tab === 'profile') loadProfile();
            });
        });

        async function loadOverview() {
            try {
                const enrollments = await Auth.api('/api/learner/enrollments');
                const notifs = await Auth.api('/api/learner/notifications');
                const active = enrollments.filter(e => e.status === 'ACTIVE');
                const completed = enrollments.filter(e => e.status === 'COMPLETED');
                const avgProgress = enrollments.length ? Math.round(enrollments.reduce((s, e) => s + e.progressPercent, 0) / enrollments.length) : 0;
                const unread = notifs.filter(n => !n.read).length;

                document.getElementById('stat-enrolled').textContent = enrollments.length;
                document.getElementById('stat-completed').textContent = completed.length;
                document.getElementById('stat-progress').textContent = avgProgress + '%';
                document.getElementById('stat-notifs').textContent = unread;

                const container = document.getElementById('active-courses-list');
                if (!active.length) {
                    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📚</div><div class="empty-state-text">No active courses. <a href="/courses.html" style="color:var(--primary);">Browse courses</a></div></div>`;
                    return;
                }
                container.innerHTML = `<div class="grid-3">` + active.slice(0, 6).map(e => `
                    <div class="card">
                        <div class="card-title">${e.courseName || 'Course'}</div>
                        <div class="progress-container"><div class="progress-bar" style="width:${e.progressPercent}%"></div></div>
                        <div style="display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text-secondary);margin-top:0.25rem;">
                            <span>${e.progressPercent}% complete</span>
                            <span class="badge ${e.status === 'COMPLETED' ? 'badge-success' : 'badge-info'}">${e.status}</span>
                        </div>
                    </div>`).join('') + '</div>';
            } catch (err) {
                document.getElementById('active-courses-list').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }

        async function loadEnrollments() {
            const c = document.getElementById('enrollments-list');
            c.innerHTML = '<div class="spinner"></div>';
            try {
                const data = await Auth.api('/api/learner/enrollments');
                if (!data.length) { c.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📚</div><div class="empty-state-text">No enrollments yet.</div></div>`; return; }
                c.innerHTML = `<div class="grid-3">` + data.map(e => `
                    <div class="card">
                        <div class="card-title">${e.courseName || 'Course'}</div>
                        <div class="card-subtitle">Enrolled ${new Date(e.enrolledAt).toLocaleDateString('en-IN')}</div>
                        <div class="progress-container"><div class="progress-bar ${e.progressPercent === 100 ? 'success' : ''}" style="width:${e.progressPercent}%"></div></div>
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:0.375rem;">
                            <span style="font-size:0.8rem;color:var(--text-secondary)">${e.progressPercent}%</span>
                            <span class="badge ${e.status === 'COMPLETED' ? 'badge-success' : 'badge-info'}">${e.status}</span>
                        </div>
                    </div>`).join('') + '</div>';
            } catch (err) { c.innerHTML = `<div class="alert alert-error">${err.message}</div>`; }
        }

        async function loadNotifications() {
            const c = document.getElementById('notifs-list');
            c.innerHTML = '<div class="spinner"></div>';
            try {
                const data = await Auth.api('/api/learner/notifications');
                if (!data.length) { c.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔔</div><div class="empty-state-text">No notifications.</div></div>`; return; }
                c.innerHTML = data.map(n => `
                    <div class="card" style="margin-bottom:0.75rem;${!n.read ? 'border-color:var(--primary);' : ''}">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                            <div>
                                <div style="font-weight:600;margin-bottom:0.2rem;">${n.title}</div>
                                <div style="font-size:0.875rem;color:var(--text-secondary)">${n.message}</div>
                            </div>
                            <div style="text-align:right;flex-shrink:0;margin-left:1rem;">
                                ${!n.read ? '<span class="badge badge-primary">New</span>' : ''}
                                <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.25rem;">${new Date(n.createdAt).toLocaleDateString()}</div>
                            </div>
                        </div>
                    </div>`).join('');
            } catch (err) { c.innerHTML = `<div class="alert alert-error">${err.message}</div>`; }
        }

        async function loadProfile() {
            try {
                const data = await Auth.api('/api/learner/profile');
                if (data) {
                    ['bio','phoneNumber','city','country','linkedinUrl','githubUrl'].forEach(f => {
                        const el = document.getElementById(f);
                        if (el && data[f]) el.value = data[f];
                    });
                }
            } catch { }
        }

        document.getElementById('profile-form').addEventListener('submit', async e => {
            e.preventDefault();
            const msg = document.getElementById('profile-msg');
            const body = {};
            ['bio','phoneNumber','city','country','linkedinUrl','githubUrl'].forEach(f => {
                body[f] = document.getElementById(f).value;
            });
            try {
                await Auth.api('/api/learner/profile', { method: 'PUT', body: JSON.stringify(body) });
                msg.innerHTML = '<div class="alert alert-success">Profile saved!</div>';
                setTimeout(() => msg.innerHTML = '', 3000);
            } catch (err) {
                msg.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        });

        loadOverview();
    </script>
</body>
</html>
