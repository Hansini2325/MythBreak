<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login – MythBreak</title>
    <meta name="description" content="Sign in to your MythBreak account."/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">MythBreak</a>
        <div class="navbar-links">
            <a href="/register.html">Don't have an account? <strong>Sign up</strong></a>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-box">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your MythBreak account</p>

            <div id="alert-box"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <input id="email" type="email" class="form-control" placeholder="you@email.com" required/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" type="password" class="form-control" placeholder="Enter your password" required/>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="submit-btn" style="margin-top:0.5rem;">
                    Sign in
                </button>
            </form>

            <p style="text-align:center;margin-top:1.25rem;color:var(--text-secondary);font-size:0.875rem;">
                New to MythBreak? <a href="/register.html" style="color:var(--primary);font-weight:600;">Create account</a>
            </p>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        if (Auth.isLoggedIn()) window.location.href = Auth.dashboardFor(Auth.getRole());

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const alertBox = document.getElementById('alert-box');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            alertBox.innerHTML = '';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Login failed');

                Auth.saveSession(data);
                window.location.href = Auth.dashboardFor(data.role);
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
