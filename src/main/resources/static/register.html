<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register – MythBreak</title>
    <meta name="description" content="Create your free MythBreak account."/>
    <link rel="stylesheet" href="/css/style.css"/>
    <style>
        .role-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.625rem; margin-bottom: 1.125rem; }
        .role-option { display: none; }
        .role-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.375rem;
            padding: 0.875rem 0.75rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.825rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
        }
        .role-option:checked + .role-label {
            border-color: var(--primary);
            background: var(--primary-bg);
            color: var(--primary);
        }
        .role-label:hover { border-color: var(--primary-light); }
        .role-emoji { font-size: 1.25rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">MythBreak</a>
        <div class="navbar-links">
            <a href="/login.html">Already have an account? <strong>Sign in</strong></a>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-box" style="max-width:480px;">
            <h1 class="auth-title">Create account</h1>
            <p class="auth-subtitle">Join MythBreak — it's free</p>

            <div id="alert-box"></div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label">I am a...</label>
                    <div class="role-selector">
                        <div>
                            <input type="radio" name="role" id="r-learner" value="LEARNER" class="role-option" required/>
                            <label for="r-learner" class="role-label"><span class="role-emoji">📚</span>Learner</label>
                        </div>
                        <div>
                            <input type="radio" name="role" id="r-earner" value="EARNER" class="role-option"/>
                            <label for="r-earner" class="role-label"><span class="role-emoji">💼</span>Earner</label>
                        </div>
                        <div>
                            <input type="radio" name="role" id="r-educator" value="EDUCATOR" class="role-option"/>
                            <label for="r-educator" class="role-label"><span class="role-emoji">🎓</span>Educator</label>
                        </div>
                        <div>
                            <input type="radio" name="role" id="r-company" value="COMPANY" class="role-option"/>
                            <label for="r-company" class="role-label"><span class="role-emoji">🏢</span>Company</label>
                        </div>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
                    <div class="form-group">
                        <label class="form-label" for="firstName">First name</label>
                        <input id="firstName" type="text" class="form-control" placeholder="Jane" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="lastName">Last name</label>
                        <input id="lastName" type="text" class="form-control" placeholder="Doe" required/>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <input id="email" type="email" class="form-control" placeholder="you@email.com" required/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password <span style="color:var(--text-muted);font-weight:400;">(min 8 characters)</span></label>
                    <input id="password" type="password" class="form-control" placeholder="Choose a password" minlength="8" required/>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="submit-btn" style="margin-top:0.5rem;">
                    Create account
                </button>
            </form>

            <p style="text-align:center;margin-top:1.25rem;color:var(--text-secondary);font-size:0.875rem;">
                Already have an account? <a href="/login.html" style="color:var(--primary);font-weight:600;">Sign in</a>
            </p>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const preRole = params.get('role');
        if (preRole) {
            const el = document.getElementById('r-' + preRole.toLowerCase());
            if (el) el.checked = true;
        }

        if (Auth.isLoggedIn()) window.location.href = Auth.dashboardFor(Auth.getRole());

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const alertBox = document.getElementById('alert-box');
            alertBox.innerHTML = '';

            const role = document.querySelector('input[name="role"]:checked');
            if (!role) {
                alertBox.innerHTML = '<div class="alert alert-error">Please select your role.</div>';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const body = {
                firstName: document.getElementById('firstName').value,
                lastName:  document.getElementById('lastName').value,
                email:     document.getElementById('email').value,
                password:  document.getElementById('password').value,
                role:      role.value
            };

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Registration failed');

                Auth.saveSession(data);
                window.location.href = Auth.dashboardFor(data.role);
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
                btn.disabled = false;
                btn.textContent = 'Create account';
            }
        });
    </script>
</body>
</html>
