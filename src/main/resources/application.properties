# Application Configuration
# Copy this file to application.properties and fill in your values.
# Or set the following environment variables before running:
#
#   DB_HOST       - MySQL host (default: localhost)
#   DB_PORT       - MySQL port (default: 3306)
#   DB_NAME       - Database name (default: mythbreak_db)
#   DB_USERNAME   - MySQL username
#   DB_PASSWORD   - MySQL password
#   JWT_SECRET    - A long random Base64 string (min 32 chars)
#   JWT_EXPIRATION- Token expiry in milliseconds (default: 86400000 = 24 hours)

# ===========================
# Server
# ===========================
server.port=8080

# ===========================
# DataSource (MySQL)
# ===========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mythbreak}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:hansini}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# JWT
# ===========================
# IMPORTANT: Replace this with a long, random secret before deploying.
# Generate one with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:bXl0aGJyZWFrLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yMDI0}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===========================
# Logging
# ===========================
logging.level.com.mythbreak=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
